name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initiate MongoDB replica set
        run: >
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval
          'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

      - run: bash scripts/check-repo-hygiene.sh
      - run: npm ci
      - run: npm run lint

      - name: Apply migrations
        run: npm run migrate:up
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/notes_api_migrate?replicaSet=rs0

      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/notes_api_test?replicaSet=rs0

      - run: npm audit --omit=dev --audit-level=high
