name: CI

on:
  push:
    branches: [main, develop, strict-pdf]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if [ "$(docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok')" = "1" ]; then
              break
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if [ "$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 1
          done

      - run: bash scripts/check-repo-hygiene.sh
      - run: npm ci
      - run: npm run lint

      - name: Apply migrations
        run: npm run migrate:up
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/notes_api_migrate?replicaSet=rs0
          JWT_SECRET: ci-migration-only-secret-at-least-32-characters

      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/notes_api_test?replicaSet=rs0

      - run: npm audit --omit=dev --audit-level=high

      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongodb || true
