services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/arifkhan1990/backend-job-task:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm run migrate:up && node src/server.js"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/notes_api?replicaSet=rs0
      AUTO_INDEX: "false"
    ports:
      - "5000:5000"

volumes:
  mongo-data:
